[project]
name = "quadrat-ipi-model-eval"
version = "1.0.0"
description = "Does an agentic model pay an invoice when an indirect prompt injection arrives inside a tool result? A harness over the Quadrat-IPI money column."
readme = "README.md"
license = "Apache-2.0"
requires-python = ">=3.11"
dependencies = [
    "openai>=1.40",
    "anthropic>=0.40",
    "huggingface_hub>=0.20",
]

[project.optional-dependencies]
figures = ["matplotlib>=3.8"]

[tool.ruff]
line-length = 100
target-version = "py311"

[tool.ruff.lint]
select = ["E", "F", "W", "B", "UP", "SIM"]
