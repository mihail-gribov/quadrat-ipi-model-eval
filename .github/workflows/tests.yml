name: tests

on:
  push:
  pull_request:

jobs:
  tests:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        python-version: ["3.11", "3.12"]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
      - run: pip install -r requirements.txt ruff
      - run: ruff check .
      # Fetches the 420 listed rows from Hugging Face and verifies the fingerprint.
      - run: python3 corpus.py
      - run: python3 test_world.py
      - run: python3 test_agent.py
      - run: python3 test_connectors.py
