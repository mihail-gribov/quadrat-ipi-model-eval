# The published row was shot through an OpenAI-compatible aggregator (the alias). This config
# is Google's own OpenAI-compatible surface on your key. Multi-hop tool use on this surface
# needs the `thought_signature` each tool call carries to be sent back on the next hop; the
# connector replays tool calls verbatim for that reason (unit-tested; not yet verified on a live
# sweep through this surface). A free-tier key is rate-limited per minute: use CONC=1.
connector = "openai"
model = "gemini-3.7-flash"
base_url = "https://generativelanguage.googleapis.com/v1beta/openai/"
api_key_env = "GOOGLE_API_KEY"
label = "gemini-3.7-flash"
aliases = ["oac:gemini/gemini-3.7-flash"]
run = true
